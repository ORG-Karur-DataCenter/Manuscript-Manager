name: Check classifier

# Verifies the free-tier classifier against known-answer fixtures. Needs no
# Gmail access, so it can confirm the engine works before the inboxes are wired up.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: "Restrict to these provider ids, comma-separated (e.g. cerebras,groq). Blank = full chain."
        required: false
        default: ""
      list_models:
        description: "Set to 1 to list the model ids each key can reach, instead of classifying."
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --omit=dev

      - name: Classify known-answer fixtures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLASSIFIER_PROVIDERS: ${{ inputs.providers }}
          LIST_MODELS: ${{ inputs.list_models }}
        run: npm run check-classifier
