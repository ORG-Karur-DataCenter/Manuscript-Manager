name: Dump candidates for offline backfill

# Fetches one account's recent mail and uploads the prefiltered candidates for
# offline classification. Makes no classifier API calls, so it is not subject to
# free-tier quotas — this is how a first backfill is done without burning a day
# of rate limit.
on:
  workflow_dispatch:
    inputs:
      account_email:
        description: "Which account in config/accounts.json to dump"
        required: true
      days:
        description: "How many days back to fetch"
        required: false
        default: "30"
      until_days:
        description: "Optional: stop at this many days back, to dump one slice of a long backfill (e.g. days=180 until_days=150)"
        required: false
        default: ""

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install --omit=dev

      - name: Fetch and prefilter
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          # One numbered slot per mailbox, matching refreshTokenEnv in
          # config/accounts.json. Numbered rather than named: these were once
          # GMAIL_REFRESH_TOKEN_SATHISH and _DHIBIN, which meant anyone setting
          # up their own copy had to type two strangers' names into their
          # secrets. Five slots is more than this needs so that adding a third
          # mailbox is a secret and a line of JSON, with no workflow to edit.
          #
          # The old names are still read when the new one is unset. A GitHub
          # secret cannot be read back, so renaming one is not a copy -- it is
          # minting a fresh OAuth token for a mailbox that may not be yours to
          # sign into. The fallback means an existing install keeps working and
          # can migrate whenever it next re-mints anyway.
          GMAIL_REFRESH_TOKEN_1: ${{ secrets.GMAIL_REFRESH_TOKEN_1 || secrets.GMAIL_REFRESH_TOKEN_SATHISH }}
          GMAIL_REFRESH_TOKEN_2: ${{ secrets.GMAIL_REFRESH_TOKEN_2 || secrets.GMAIL_REFRESH_TOKEN_DHIBIN }}
          GMAIL_REFRESH_TOKEN_3: ${{ secrets.GMAIL_REFRESH_TOKEN_3 }}
          GMAIL_REFRESH_TOKEN_4: ${{ secrets.GMAIL_REFRESH_TOKEN_4 }}
          GMAIL_REFRESH_TOKEN_5: ${{ secrets.GMAIL_REFRESH_TOKEN_5 }}
          OUTLOOK_CLIENT_ID: ${{ secrets.OUTLOOK_CLIENT_ID }}
          OUTLOOK_CLIENT_SECRET: ${{ secrets.OUTLOOK_CLIENT_SECRET }}
          OUTLOOK_REFRESH_TOKEN_1: ${{ secrets.OUTLOOK_REFRESH_TOKEN_1 || secrets.OUTLOOK_REFRESH_TOKEN_DHIBIN }}
          OUTLOOK_REFRESH_TOKEN_2: ${{ secrets.OUTLOOK_REFRESH_TOKEN_2 }}
          ACCOUNT_EMAIL: ${{ inputs.account_email }}
          DUMP_DAYS: ${{ inputs.days }}
          DUMP_UNTIL_DAYS: ${{ inputs.until_days }}
          DUMP_OUT: ${{ runner.temp }}/import-candidates.json
        run: npm run dump-candidates

      # Deliberately NOT committed: this file holds message bodies, and the
      # repository is public. Kept for one day and deleted once consumed.
      - uses: actions/upload-artifact@v4
        with:
          name: import-candidates
          path: ${{ runner.temp }}/import-candidates.json
          retention-days: 1
