<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMOG COMMS · Dr Sathish Muthu Orthopaedic Research Group</title>
<meta name="description" content="SMOG COMMS — Dr Sathish Muthu Orthopaedic Research Group Collaborative Manuscript Management System." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="brand">
      <span class="brand-mark">SMOG</span>
      <div>
        <div class="brand-title">SMOG&nbsp;COMMS</div>
        <div class="brand-sub" id="generated-at">Loading…</div>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.3-4.3M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
        <input id="search" type="search" placeholder="Search title, journal, manuscript no…" autocomplete="off" />
      </div>
      <button id="theme-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.39 5.39 0 0112 3z"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-inner">
    <div class="hero-eyebrow">Dr Sathish Muthu · Orthopaedic Research Group</div>
    <h1 class="hero-title">
      <span class="hero-acronym">SMOG&nbsp;COMMS</span>
    </h1>
    <p class="hero-expand">
      <b>S</b>athish <b>M</b>uthu <b>O</b>rthopaedic <b>G</b>roup ·
      <b>Co</b>llaborative <b>M</b>anuscript <b>M</b>anagement <b>S</b>ystem
    </p>
  </div>
</section>

<main class="wrap">
  <!-- Action buttons / filters -->
  <nav class="buckets" id="buckets" aria-label="Filter by status">
    <button class="bucket-btn active" data-bucket="all">
      <span class="bucket-icon all">◎</span>
      <span class="bucket-text"><span class="bucket-name">All manuscripts</span><span class="bucket-count" data-count="all">0</span></span>
    </button>
    <button class="bucket-btn" data-bucket="submissions">
      <span class="bucket-icon submissions">↑</span>
      <span class="bucket-text"><span class="bucket-name">Submissions</span><span class="bucket-count" data-count="submissions">0</span></span>
    </button>
    <button class="bucket-btn attn" data-bucket="needs_action">
      <span class="bucket-icon needs_action">!</span>
      <span class="bucket-text"><span class="bucket-name">Needs action</span><span class="bucket-count" data-count="needs_action">0</span></span>
    </button>
    <button class="bucket-btn" data-bucket="in_review">
      <span class="bucket-icon in_review">◷</span>
      <span class="bucket-text"><span class="bucket-name">In review</span><span class="bucket-count" data-count="in_review">0</span></span>
    </button>
    <button class="bucket-btn" data-bucket="published">
      <span class="bucket-icon published">✓</span>
      <span class="bucket-text"><span class="bucket-name">Published</span><span class="bucket-count" data-count="published">0</span></span>
    </button>
    <button class="bucket-btn review" data-bucket="review">
      <span class="bucket-icon review">⚑</span>
      <span class="bucket-text"><span class="bucket-name">Needs review</span><span class="bucket-count" data-count="review">0</span></span>
    </button>
  </nav>

  <div id="bucket-hint" class="bucket-hint"></div>

  <section id="cards" class="cards" aria-live="polite"></section>
  <div id="empty" class="empty" hidden></div>
</main>

<!-- Detail drawer -->
<div id="drawer-overlay" class="drawer-overlay" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Manuscript detail">
  <div class="drawer-head">
    <button id="drawer-close" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<footer class="foot">
  <div class="wrap">
    SMOG COMMS · Dr Sathish Muthu Orthopaedic Research Group
  </div>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
